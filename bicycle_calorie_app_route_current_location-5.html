<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>自転車カロリー＆ルート</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
body{font-family:system-ui,sans-serif;max-width:680px;margin:auto;padding:14px;background:#f5f7fb}.card{background:#fff;border-radius:18px;padding:18px;margin:10px 0;box-shadow:0 2px 12px #0001}h1{text-align:center;font-size:23px}.sub{text-align:center;color:#666;font-size:13px}label{display:block;margin-top:10px;font-weight:700}input,select,button{box-sizing:border-box;padding:11px;margin-top:5px;border:1px solid #ddd;border-radius:10px;font-size:16px}.search{display:flex;gap:6px}.search input{flex:1}.search button,.main{background:#2563eb;color:#fff;border:0;font-weight:bold}.search button{width:80px}.main{width:100%;margin-top:14px}#suggestions{max-height:180px;overflow:auto}.suggest{width:100%;text-align:left;background:#fff;border-bottom:1px solid #eee}.suggest b{display:block}.suggest small{color:#666}#map{height:400px;border-radius:12px;margin-top:10px}.routeInfo{text-align:center;font-weight:bold;margin:10px 0;padding:10px;background:#eef3ff;border-radius:10px}.actions{display:flex;gap:8px}.actions button{flex:1;background:#eef3ff;border:0}#result{text-align:center;font-size:19px;font-weight:bold;line-height:1.8}
</style></head><body>
<h1>🚲 自転車カロリー計算</h1><div class="sub">出発地と目的地を検索して道路ルートを表示</div>
<div class="card"><label id="searchLabel">📍 出発地を検索</label><div class="search"><input id="place" placeholder="例：富山第一高校、富山駅" autocomplete="off"><button onclick="search()">検索</button></div><div id="suggestions"></div><div id="map"></div><div class="actions"><button onclick="useCurrentLocation()">📍 現在地を使う</button><button onclick="mode='start';updateLabel()">出発地を選ぶ</button><button onclick="mode='goal';updateLabel()">目的地を選ぶ</button><button onclick="clearRoute()">リセット</button></div><div class="routeInfo" id="routeInfo">出発地を検索して選んでね</div></div>
<div class="card"><label>体重（kg）</label><input id="weight" type="number" value="60"><label>平均速度（km/h）</label><input id="speed" type="number" value="15"><label>天候</label><select id="weather"><option value="1">晴れ</option><option value="1.05">暑い</option><option value="1.08">寒い</option><option value="1.12">雨</option><option value="1.15">強い風</option></select><button class="main" onclick="calc()">🔥 消費カロリーを計算</button></div><div class="card" id="result">ルートを作成して計算！</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const map=L.map('map').setView([36.6953,137.2113],12);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors'}).addTo(map);
let mode='start',start=null,goal=null,startMarker=null,goalMarker=null,routeLine=null,routeKm=0,timer;
function updateLabel(){searchLabel.textContent=mode==='start'?'📍 出発地を検索':'🏁 目的地を検索';place.placeholder=mode==='start'?'出発地：例 富山駅':'目的地：例 富山第一高校'}
place.addEventListener('input',()=>{clearTimeout(timer);if(place.value.trim().length<2)return;suggestions.innerHTML='';timer=setTimeout(search,350)});
async function search(){let q=place.value.trim();if(q.length<2)return;suggestions.innerHTML='検索中...';try{let u='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=8&countrycodes=jp&accept-language=ja&q='+encodeURIComponent(q);let d=await(await fetch(u)).json();suggestions.innerHTML='';if(!d.length){suggestions.innerHTML='見つかりません。市町村名も追加してみてね';return}d.forEach(p=>{let b=document.createElement('button');b.className='suggest';b.innerHTML='<b>📍 '+p.display_name.split(',')[0]+'</b><small>'+p.display_name+'</small>';b.onclick=()=>selectPlace(p);suggestions.appendChild(b)})}catch(e){suggestions.innerHTML='検索エラー'}}
function selectPlace(p){let ll=L.latLng(+p.lat,+p.lon);map.setView(ll,16);if(mode==='start'){start=ll;if(startMarker)map.removeLayer(startMarker);startMarker=L.marker(ll).addTo(map).bindPopup('📍 出発地').openPopup();mode='goal';updateLabel()}else{goal=ll;if(goalMarker)map.removeLayer(goalMarker);goalMarker=L.marker(ll).addTo(map).bindPopup('🏁 目的地').openPopup();mode='start';updateLabel()}suggestions.innerHTML='';place.value='';if(start&&goal)getRoute()}
async function getRoute(){routeInfo.textContent='🚲 道路ルートを計算中...';try{let c=`${start.lng},${start.lat};${goal.lng},${goal.lat}`;let u='https://router.project-osrm.org/route/v1/driving/'+c+'?overview=full&geometries=geojson';let d=await(await fetch(u)).json();if(d.code!=='Ok')throw Error();let r=d.routes[0];routeKm=r.distance/1000;if(routeLine)map.removeLayer(routeLine);let latlngs=r.geometry.coordinates.map(x=>[x[1],x[0]]);routeLine=L.polyline(latlngs,{weight:6}).addTo(map);map.fitBounds(routeLine.getBounds(),{padding:[30,30]});routeInfo.innerHTML=`🚲 道路に沿った距離：約 ${routeKm.toFixed(2)} km<br>⏱️ 推定時間：約 ${Math.round(routeKm/15*60)} 分`}catch(e){routeKm=map.distance(start,goal)/1000;routeInfo.innerHTML=`⚠️ ルート取得失敗。直線距離：約 ${routeKm.toFixed(2)} km`}}
function useCurrentLocation(){
 if(!navigator.geolocation){alert('この端末では現在地を取得できません');return}
 routeInfo.textContent='📍 現在地を取得中...';
 navigator.geolocation.getCurrentPosition(
  pos=>{
   const ll=L.latLng(pos.coords.latitude,pos.coords.longitude);
   map.setView(ll,16);
   if(mode==='start'){
    start=ll;if(startMarker)map.removeLayer(startMarker);
    startMarker=L.marker(ll).addTo(map).bindPopup('📍 現在地（出発地）').openPopup();
    mode='goal';
   }else{
    goal=ll;if(goalMarker)map.removeLayer(goalMarker);
    goalMarker=L.marker(ll).addTo(map).bindPopup('📍 現在地（目的地）').openPopup();
    mode='start';
   }
   updateLabel();
   if(start&&goal)getRoute();else routeInfo.textContent='🏁 次に目的地を検索して選んでね';
  },
  err=>{routeInfo.textContent='現在地を取得できませんでした。位置情報の許可を確認してね。';alert('位置情報の利用を許可してからもう一度試してね')},
  {enableHighAccuracy:true,timeout:10000,maximumAge:30000}
 );
}
function clearRoute(){[startMarker,goalMarker,routeLine].forEach(x=>{if(x)map.removeLayer(x)});start=goal=startMarker=goalMarker=routeLine=null;routeKm=0;routeInfo.textContent='出発地を検索して選んでね';mode='start';updateLabel()}
function calc(){let w=+weight.value,s=+speed.value,m=+weather.value;if(!w||!s||!routeKm){result.textContent='出発地と目的地を選んでね';return}let h=routeKm/s,mets=s<13?4:s<16?6.8:s<19?8:10,k=Math.round(mets*w*h*m);result.innerHTML=`📏 道路距離：${routeKm.toFixed(2)} km<br>🚲 走行時間：約${Math.round(h*60)}分<br>🔥 推定消費量：約${k} kcal`}</script></body></html>
